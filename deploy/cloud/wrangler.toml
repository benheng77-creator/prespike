name = "apex-omega-api"
main = "worker.js"
compatibility_date = "2024-09-23"

# KV namespace — create with:  wrangler kv namespace create APEX_STATE
# Then paste the id below.
[[kv_namespaces]]
binding = "APEX_STATE"
id = "b2e43cd13d0b4cb19a526c2dac0e5d4d"

# Secrets (set via `wrangler secret put INGEST_TOKEN`):
#   INGEST_TOKEN = shared secret between desktop publisher + this worker

[vars]
ENVIRONMENT = "production"
