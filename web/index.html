<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>claw247 — sign in</title>
<style>
:root{
  --bg-app:#F7F8FA;--bg-surface:#FFFFFF;--border:#E5E8EC;--ink-1:#0F1419;--ink-2:#3A434E;--ink-3:#6A7685;
  --accent:#1F4DFF;--accent-quiet:#E7ECFF;
}
*{box-sizing:border-box}
body{margin:0;font:400 15px/1.5 Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--ink-1);background:var(--bg-app);-webkit-font-smoothing:antialiased}
.wrap{min-height:100vh;display:grid;place-items:center;padding:32px}
.card{background:var(--bg-surface);border:1px solid var(--border);border-radius:12px;max-width:520px;width:100%;padding:40px;box-shadow:0 1px 2px rgba(15,20,25,.06)}
h1{margin:0 0 4px;font-size:22px;letter-spacing:-.01em}
p.sub{margin:0 0 28px;color:var(--ink-3);font-size:14px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
a.btn{display:flex;flex-direction:column;gap:4px;padding:20px;border:1px solid var(--border);border-radius:10px;text-decoration:none;color:var(--ink-1);background:var(--bg-surface);transition:border-color .12s ease,background .12s ease}
a.btn:hover{border-color:var(--accent);background:var(--accent-quiet)}
a.btn b{font-size:15px}
a.btn span{color:var(--ink-3);font-size:13px}
small{display:block;margin-top:24px;color:var(--ink-3);font-size:12px}
</style>
</head>
<body>
<div class="wrap">
  <div class="card">
    <h1>claw247</h1>
    <p class="sub">Internal access. Choose your surface.</p>
    <div class="row">
      <a class="btn" href="/app/"><b>User dashboard</b><span>Portfolio, trade, funds</span></a>
      <a class="btn" href="/ops/"><b>Operator center</b><span>Bot control, monitors, audit</span></a>
    </div>
    <small>Internal use only. All actions are audited.</small>
  </div>
</div>
</body>
</html>
